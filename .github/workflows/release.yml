name: Release

# herdr installs plugins straight from git, so a release is a checked tag plus its changelog
# section: nothing to build.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches herdr-plugin.toml
        run: |
          manifest="$(sed -nE 's/^version = "([^"]+)"/\1/p' herdr-plugin.toml | head -n1)"
          if [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME != herdr-plugin.toml version $manifest" >&2
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
